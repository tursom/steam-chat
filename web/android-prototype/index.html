<!doctype html>
<!-- Disposable Android flow prototype. All accounts, transport and notifications are simulated in memory. -->
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Steam Chat Android · 交互原型</title><link rel="stylesheet" href="./style.css"></head><body><main class="prototype-stage"><aside class="intro"><span class="eyebrow">STEAM CHAT / ANDROID</span><h1>聊天，随时接续。</h1><p>荣耀 WIN RT<br>MagicOS 10 · Android 16</p><div class="design-note"><span>A / MOBILE</span><h2>熟悉的聊天体验</h2><p>文字、图片、Steam 表情。<br>消息提醒与实时连接放在同一个流程里。</p></div><div class="prototype-warning">交互原型 · 非 APK<br>登录、联网、锁屏和通知均为模拟，不会连接真实后端。请勿输入真实密码。</div></aside><section class="phone" aria-label="Android 手机原型"><div class="android-status"><span>14:32</span><div><i data-lucide="signal"></i><i data-lucide="wifi"></i><i data-lucide="battery-full"></i></div></div><div id="app"></div><div id="notification" hidden></div><div class="gesture-bar"><span></span></div></section><aside class="scenario-panel"><span class="eyebrow">交互演示</span><h2>试试消息到达的过程</h2><div class="scenario-actions"><button data-action="receive"><i data-lucide="message-circle-plus"></i><span>收到一条消息<small>来自林间晚风</small></span><i data-lucide="arrow-up-right"></i></button><button data-action="lock"><i data-lucide="lock-keyhole"></i><span>进入锁屏<small>查看通知样式</small></span><i data-lucide="arrow-up-right"></i></button><button data-action="network"><i data-lucide="wifi-off"></i><span id="network-action-label">模拟断网<small>重连后补收消息</small></span><i data-lucide="arrow-up-right"></i></button><button data-action="setup"><i data-lucide="server"></i><span>首次配置<small>地址 → 登录 → 会话</small></span><i data-lucide="arrow-up-right"></i></button></div><dl class="simulation-state"><dt>连接状态</dt><dd id="lab-network"></dd><dt>待补收消息</dt><dd id="lab-pending"></dd><dt>未读消息</dt><dd id="lab-unread"></dd></dl><p class="lab-note">通知显示在此页面内，不会触发手机系统通知。原生版本的后台到达率需要荣耀真机验证。</p></aside></main><div class="flow-switcher"><button id="previous" aria-label="上一场景" title="上一场景"><i data-lucide="arrow-left"></i></button><span><small>ANDROID PROTOTYPE</small><strong id="screen-name"></strong></span><button id="next" aria-label="下一场景" title="下一场景"><i data-lucide="arrow-right"></i></button><button class="mobile-lab" data-action="lab" title="模拟消息与网络" aria-label="模拟消息与网络"><i data-lucide="sliders-horizontal"></i></button></div><input type="file" id="photo-input" accept="image/*" hidden><script src="../prototype/assets/lucide.min.js"></script><script src="./app.js"></script></body></html>
