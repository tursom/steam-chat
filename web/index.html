<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Steam Chat</title>
    <meta name="color-scheme" content="light dark">
    <script>
      // Run before styles to apply the saved preference on the first paint.
      (() => {
        let theme = 'auto';
        try {
          const saved = localStorage.getItem('steam-chat.theme');
          if (saved === 'light' || saved === 'dark') theme = saved;
        } catch { /* System theme still works when storage is unavailable. */ }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0c0c0e" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Steam Chat">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/icons/steam-chat.ico" sizes="16x16 32x32 48x48">
    <link rel="icon" type="image/svg+xml" href="/icons/steam-chat.svg" sizes="any">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" sizes="180x180">
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <div id="app" role="main"></div>
    <div id="lightbox" class="lightbox" hidden>
      <button id="lightboxClose" class="icon-btn lightbox-close" type="button" title="关闭" aria-label="关闭"><span class="ui-icon icon-x" aria-hidden="true"></span></button>
      <img id="lightboxImage" alt="">
    </div>
    <script src="/console.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
